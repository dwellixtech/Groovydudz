# Settles PayU orders stuck in "pending" (closed tab, lost redirect, missed webhook) every 15 min.
# Vercel Hobby only allows a daily cron, so GitHub Actions runs it more often.
# Needs repo secret CRON_SECRET (same value as the Vercel env var) and variable API_URL.
name: Reconcile PayU payments

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reconcile job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.API_URL || 'https://groovydudz-api.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret not set; skipping"; exit 0; fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$API_URL/jobs/reconcile-payments"
